---
layout: default
---
<article class="post">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; {{ site.name }}</a>
  <h1>{{ page.title }}</h1>
  {% if page.authors %}<div class="authors">{{ page.authors }}</div>{% endif %}
  {% if page.venue %}<p class="venue"><em>{{ page.venue }}</em>, {{ page.date | date: '%Y' }}</p>{% endif %}
  {% include publication-links.html post=page %}
  {{ content }}
</article>
