<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="{{ site.name | escape }}">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | strip_html | escape }} | {% endif %}{{ site.name | escape }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="container">
    {{ content }}
  </main>
  <footer class="container site-footer">
    Design inspired by <a href="https://github.com/HaozhiQi/haozhiqi.github.io">Haozhi Qi</a>,
    with thanks to <a href="https://jonbarron.info/">Jon Barron</a>.
  </footer>
</body>
</html>
