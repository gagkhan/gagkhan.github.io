<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img"><title>Adapt dynamics. Reuse the correction.</title><desc>Proposed design • real transitions update the model; policy improvement uses imagined outcomes.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087e8b"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#617381"/></marker><linearGradient id="depth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6f1ee"/><stop offset="1" stop-color="#147c8d"/></linearGradient></defs><rect width="100%" height="100%" fill="#fff"/><text x="44" y="42.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#087e8b" text-anchor="start" letter-spacing="2">02 / ADAPTATION ARCHITECTURE</text><text x="44" y="91.0" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="700" fill="#142b3b" text-anchor="start" letter-spacing="0">Adapt dynamics. Reuse the correction.</text><text x="44" y="128.0" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#617381" text-anchor="start" letter-spacing="0">Proposed design • real transitions update the model; policy improvement uses imagined outcomes.</text><rect x="40" y="175" width="1520" height="410" rx="18" fill="#f7fafb" stroke="#d7e1e5" stroke-width="1.5"/><text x="70" y="212.0" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#617381" text-anchor="start" letter-spacing="1">MODEL ADAPTATION</text><rect x="70" y="245" width="330" height="145" rx="12" fill="#fff" stroke="#d7e1e5" stroke-width="1.5"/><text x="95" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142b3b" text-anchor="start" letter-spacing="0">Real interaction</text><text x="95" y="319.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#617381" text-anchor="start" letter-spacing="0">Observations + actions</text><text x="95" y="345.22" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#617381" text-anchor="start" letter-spacing="0">No reward labels for fitting</text><rect x="530" y="245" width="380" height="145" rx="12" fill="#e8f5f3" stroke="#087e8b" stroke-width="1.5"/><text x="555" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142b3b" text-anchor="start" letter-spacing="0">World model</text><text x="555" y="319.0" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#087e8b" text-anchor="start" letter-spacing="0">Initialize from simulation</text><text x="555" y="345.22" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#087e8b" text-anchor="start" letter-spacing="0">Adapt to real transitions</text><path d="M400 318 H520" fill="none" stroke="#087e8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="465" y="299.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#087e8b" text-anchor="middle" letter-spacing="0">fit</text><path d="M720 390 V470" fill="none" stroke="#087e8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="740" y="435.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#087e8b" text-anchor="start" letter-spacing="0">adapted dynamics</text><rect x="530" y="480" width="380" height="80" rx="12" fill="#fff" stroke="#d7e1e5" stroke-width="1.5"/><text x="720" y="513.0" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#142b3b" text-anchor="middle" letter-spacing="0">Imagined policy rollouts</text><text x="720" y="543.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#617381" text-anchor="middle" letter-spacing="0">optimize policy parameters</text><rect x="1080" y="245" width="390" height="145" rx="12" fill="#fff6eb" stroke="#e8c5a4" stroke-width="1.5"/><text x="1105" y="280.0" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#142b3b" text-anchor="start" letter-spacing="0">Reward model</text><text x="1105" y="319.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#bc6633" text-anchor="start" letter-spacing="0">Keep fixed during adaptation</text><text x="1105" y="343.84" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#bc6633" text-anchor="start" letter-spacing="0">Requires a stable input interface</text><path d="M910 505 H990 V320 H1070" fill="none" stroke="#617381" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/><text x="1007" y="425.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#617381" text-anchor="start" letter-spacing="0">score</text><path d="M1275 390 V535 H920" fill="none" stroke="#087e8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arr)"/><text x="1170" y="568.0" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#087e8b" text-anchor="middle" letter-spacing="0">policy-gradient path</text><path d="M530 520 H235 V400" fill="none" stroke="#087e8b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="260" y="470.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#087e8b" text-anchor="start" letter-spacing="0">Deploy updated policy</text><text x="44" y="640.0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#087e8b" text-anchor="start" letter-spacing="1">THE REUSE TEST</text><text x="44" y="680.0" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#142b3b" text-anchor="start" letter-spacing="0">Does adaptation from skill A improve skill B?</text><text x="44" y="723.0" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#617381" text-anchor="start" letter-spacing="0">Measure real-world success at matched interaction budgets—not only model prediction error.</text></svg>